name: Release CatLog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0-rc1)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (build, test, and upload artifacts without publishing GitHub release)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

# release.yml: Multi-platform Release Workflow for CatLog
#
# Release Modes:
# 1. workflow_dispatch (manual trigger):
#    - dry_run: true (default) -> Builds all platforms, executes test suites, and uploads
#      build artifacts for inspection. DOES NOT tag git, DOES NOT publish a GitHub release.
#    - dry_run: false -> Builds and publishes a GitHub release.
# 2. Tag push ('v*') -> Builds and publishes an official release tagged in git.
#
# Packaging Architecture (onedir vs onefile):
# - CatLog defaults to 'onedir' packaging (PyInstaller COLLECT into dist/CatLog/)
#   which is archived into CatLog-<version>-<platform>.zip.
#   Onedir achieves an average cold startup time of ~1.60s on Windows, eliminating the
#   15-24s self-extraction latency of onefile executables unpacking to %TEMP%.
# - A comparison onefile archive (CatLog-<version>-<platform>-onefile.zip) is also bundled.
#
# Known Platform-Specific Considerations & Potential CI Failure Modes:
# - macOS Intel Runner: 'macos-15-intel' is GitHub's official label for x86_64 Intel builds
#   (macos-13 has been retired by GitHub; macos-14/macos-15 are Apple Silicon arm64).
# - macOS Gatekeeper: Unsigned macOS binaries trigger Apple Gatekeeper warnings unless
#   signed with an Apple Developer ID and notarized via 'xcrun notarytool'.
# - Linux WebKitGTK & Display: Ubuntu 24.04+ requires 'gir1.2-webkit2-4.1' while 20.04/22.04
#   use 4.0. In headless environments, smoke tests must run with '--no-gui' (or under xvfb-run).
#
jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            archive_ext: zip
            is_beta: false
          - os: ubuntu-latest
            platform: linux-x64
            archive_ext: tar.gz
            is_beta: true
          - os: macos-latest
            platform: macos-arm64
            archive_ext: zip
            is_beta: true
          - os: macos-15-intel
            platform: macos-x64
            archive_ext: zip
            is_beta: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_VER="${{ github.event.inputs.tag_name }}"
            TAG_VER="${TAG_VER#v}"
            echo "$TAG_VER" > VERSION
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "$TAG_VER" > VERSION
          fi
          VER=$(cat VERSION | tr -d ' \r\n')
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "Building CatLog version $VER on ${{ matrix.platform }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 xvfb || sudo apt-get install -y libgl1 libglib2.0-0 gir1.2-webkit2-4.0 xvfb || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest httpx requests

      - name: Synchronize version across project files
        run: |
          python scripts/sync_version.py

      - name: Build Frontend & Viewer
        run: |
          npm --prefix frontend ci || npm --prefix frontend install
          npm --prefix frontend run build
          npm --prefix viewer ci || npm --prefix viewer install
          npm --prefix viewer run build

      - name: Run Backend Pytest Suite
        run: |
          pytest tests -q -rs

      - name: Run Frontend & Viewer Vitest Suites
        run: |
          npm --prefix frontend test
          npm --prefix viewer test

      - name: Run Bundle Hygiene Check
        run: |
          python eval/verify_export.py

      - name: Build Standalone Executable (PyInstaller)
        run: |
          pyinstaller --clean photosorter.spec

      - name: Smoke Test Executable Artifact
        run: |
          python scripts/smoke_test.py

      - name: Package Portable Archive
        run: |
          python scripts/package_release.py --version ${{ env.VERSION }} --platform ${{ matrix.platform }}

      - name: Upload Platform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catlog-${{ matrix.platform }}
          path: dist_release/CatLog-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version & prerelease flag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(cat VERSION | tr -d ' \r\n')"
          fi
          VER="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VER" >> $GITHUB_ENV

          # Detect prerelease (contains '-' like -rc1, -beta, -alpha)
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
            echo "Release type: Pre-release"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
            echo "Release type: Production"
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts/

      - name: Organize release archives & compute SHA-256 checksums
        shell: bash
        run: |
          mkdir -p dist_release
          find downloaded_artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist_release/ \;
          python scripts/package_release.py --generate-sums --out-dir dist_release/
          ls -la dist_release/

      - name: Generate Release Notes
        shell: bash
        run: |
          python scripts/generate_release_notes.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CatLog ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            dist_release/CatLog-*
            dist_release/SHA256SUMS.txt
