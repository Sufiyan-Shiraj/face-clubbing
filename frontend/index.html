<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhotoSorter - Event Organizer</title>
    <meta name="description" content="Local face clustering, organizer review, and event photo sorting." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen antialiased">
    <div id="root">
      <div id="app-loading" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#0a0a0a; color:#f3f4f6; font-family:'Inter',system-ui,sans-serif;">
        <div style="width:36px; height:36px; border:3px solid #27272a; border-top-color:#3b82f6; border-radius:50%; animation:app-spin 0.8s linear infinite;"></div>
        <div style="margin-top:16px; font-weight:600; font-size:15px; letter-spacing:-0.01em;">PhotoSorter</div>
        <div style="margin-top:6px; font-size:12px; color:#71717a;">Connecting to local engine...</div>
        <style>@keyframes app-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
